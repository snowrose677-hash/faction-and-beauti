<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Deals</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f6ff;
}

/* HEADER */
header{
    background: linear-gradient(135deg,#ff4d6d,#6c63ff);
    color:white;
    text-align:center;
    padding:25px;
}

header input{
    margin-top:10px;
    padding:10px;
    width:60%;
    border-radius:10px;
    border:none;
}

/* PRODUCTS GRID */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    padding:20px;
}

/* CARD STYLE */
.card{
    background:white;
    padding:15px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    border-radius:10px;
}

/* BUTTON */
button{
    background:#6c63ff;
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#4b42d6;
}

/* PINTEREST SECTION */
.pinterest{
    padding:40px;
    text-align:center;
    background:white;
    margin:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* FOOTER */
footer{
    background:#222;
    color:white;
    padding:30px;
    text-align:center;
}

.social-icons a{
    color:white;
    margin:0 10px;
    font-size:20px;
}
</style>

</head>

<body>

<header>
<h1>🔥 Best Deals</h1>
<input type="text" placeholder="Search beauty product...">
</header>

<section class="products">

<div class="card">
<img src="download.jpg">
<h3>Eye Shadow</h3>
<p>$29</p>
<button>Buy on Amazon</button>
</div>

<div class="card">
<img src="dress.jpg">
<h3>Fashion Dress</h3>
<p>$49</p>
<button>Buy on Amazon</button>
</div>

<div class="card">
<img src="lipstick.jpg">
<h3>Lipstick</h3>
<p>$19</p>
<button>Buy on Amazon</button>
</div>

<div class="card">
<img src="handbag.jpg">
<h3>Handbags</h3>
<p>$39</p>
<button>Buy on Amazon</button>
</div>

<div class="card">
<img src="shoes.jpg">
<h3>Shoes</h3>
<p>$29</p>
<button>Buy on Amazon</button>
</div>

</section>

<!-- PINTEREST -->
<div class="pinterest">
<h2>📌 Trending on Pinterest</h2>
<p>Latest beauty & fashion inspiration</p>

<a data-pin-do="embedUser" 
href="https://www.pinterest.com/gulx3754/">
</a>
</div>

<script async defer src="https://assets.pinterest.com/js/pinit.js"></script>

<!-- FOOTER -->
<footer>

<p>© 2026 Best Deals</p>

<div class="social-icons">
<a href="#"><i class="fab fa-facebook"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-twitter"></i></a>
<a href="#"><i class="fab fa-youtube"></i></a>
</div>

</footer>

</body>
</html>
